<!DOCTYPE html>
<html lang="ko" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>item test</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-BmbxuPwQa2lc/FVzBcNJ7UAyJxM6wuqIj61tLrc4wSX0szH/Ev+nYRRuWlolflfl" crossorigin="anonymous">
  <link rel="stylesheet" href="./css/default.css">
  <link rel="stylesheet" href="./css/main.css">
  <link rel="stylesheet" href="./css/qna.css">
  <link rel="stylesheet" href="./css/animation.css">
  <link rel="stylesheet" href="./css/result.css">
  <script src="https://developers.kakao.com/sdk/js/kakao.js"></script>   

  <!-- Global site tag (gtag.js) - Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-9EP552BQ61"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-9EP552BQ61');
  </script>
</head>

<body>
  <div class="container">
    <section id="main" class="mx-auto mx-5 my-5 py-1"> 
    <div class="col-lg-6 col-md 8 col-sm 8 col-12 mx-auto">
    <img src="./img/main.png" alt="mainImage" class="img-fluid">
    </div>
    <p>
       <br>
       <br>
       <br>
        낯선 마을로 이사 온 당신<br>
        이곳에서의 적응을 도와줄 <br>
        아이템은 무엇일까
    </p>
    <button type="button" class="btn btn-outline-secondary  btn-lg mt-5 mx-5" 
     onclick="js:begin()">START</button>
    <div class="col-lg-6 col-md 8 col-sm 8 col-12 mx-auto">
    </div>
    </section>  

    <section id="qna">
      <div class="status mx-auto my-4">
        <div class="statusBar">
        </div>
      </div>

      <div class="qBox mt-1 my-3 py-3 mx-auto">
      </div>
      <div class="card col-lg-4 col-md-8 col-sm-8 col-6 mx-auto">
        <img src="./img/main.png" class="card-img-top icon mx-auto col-lg-6 col-md-8 col-sm-8 col-6" alt="..." >
      </div>

      <div class="contain">
      </div>
      
      <div class="answerBox py-4">
      </div>
    </section>
    
    <section id="result" class="mx-auto py-3 px-3">
      <img src="./img/r1.png"class="col-lg-2 col-md-2 col-sm-2 col-2" div style="float:left;">   
      <img src="./img/r2.png" class="col-lg-2 col-md-2 col-sm-2 col-2"div style="float:right;">
      <div style="clear:both"></div>

      <div class="resultdefault">
        당신은...<br>
      </div>
      
      <div class="resultperson">
      </div>

      <div class="resultname" style="margin-top: 25px;">
      </div>

      <div id="resultImg" class="my-3 col-lg-6 col-md-8 col-sm-10 col-12 mx-auto" style="height: max-content;"> 

      </div>
      <div id="resultDesc" class="my-3 col-lg-6 col-md-8 col-sm-10 col-12 mx-auto">

      </div>
      <div class="bestsection my-3 col-lg-6 col-md-8 col-sm-10 col-12 mx-auto">
        <div class="besttitle">
          😍찰떡궁합😍
        </div>
        <hr>
        <div class="bestresult">

        </div>
      </div>
      <div class="worstsection my-3 col-lg-6 col-md-8 col-sm-10 col-12 mx-auto">
        <div class="worsttitle">
          😠개떡궁합😠
        </div>
        <hr>
        <div class="worstresult">
        </div>
      </div>

      <button type="button" class="return mt-3 py-2 px-3" onclick="document.location.href='https://llprn.github.io/itemTest/'">다시하기</button>
      <button type="button" class="return mt-3 py-2 px-3"  onclick="js:setShare()">결과공유</button>
      <button type="button" class="itemlink mt-3 py-2 px-3" onclick="pageOn()">상품보기</button>

      <script type="text/javascript">
      </script>
      
      <script type="text/javascript" async> 
        var url_default_ks=  "https://story.kakao.com/share?url=";
        var url_default_fb = "https://www.facebook.com/sharer/sharer.php?u=";
        var url_default_tw_txt = "https://twitter.com/intent/tweet?text="; 
        var url_default_tw_url = "&url="; 
        var url_default_naver = "http://share.naver.com/web/shareView.nhn?url="; 
        var title_default_naver = "&title="; 
        var url_this_page = location.href; 
        var title_this_page = document.title; 
        var url_combine_ks = url_default_ks + url_this_page; 
        var url_combine_fb = url_default_fb + url_this_page; 
        var url_combine_tw = url_default_tw_txt + document.title + url_default_tw_url + url_this_page; 
        var url_combine_naver = url_default_naver + encodeURI(url_this_page) + title_default_naver + encodeURI(title_this_page); 
      </script>
      
      <!-- SNS share buttons --> 
      <div style="width: 100%; text-align: center; margin-top: 40px; margin-bottom: 64px;"> 
      <!-- Facebook share button --> 
      <a href="" onclick="window.open(url_combine_fb, '', 'scrollbars=no, width=600, height=600'); return false;">
      <img src="https://imgur.com/2pxqHxt.png" title="페이스북으로 공유하기" class="sharebtn_custom" style="width: 48px;"></a> 
      <!-- Twitter share button --> 
      <a href="" onclick="window.open(url_combine_tw, '', 'scrollbars=no, width=600, height=600'); return false;">
      <img src="https://imgur.com/z7V4qga.png" title="트위터로 공유하기" class="sharebtn_custom" style="width: 48px;"></a> 
      <!-- Naver share button --> 
      <a href="" onclick="window.open(url_combine_naver, '', 'scrollbars=no, width=600, height=600'); return false;">
      <img src="https://imgur.com/AYqtESo.png" title="네이버로 공유하기" class="sharebtn_custom" style="width: 48px;"></a> 
      <!-- Kakao story share button --> 
      <a href="" onclick="window.open(url_combine_ks, '', 'scrollbars=no, width=600, height=600'); return false;">
      <img src="https://imgur.com/mIW39pd.jpg" title="카카오스토리로 공유하기" class="sharebtn_custom" style="width: 48px;"></a>
      </div>      
    </section>
    <script src="./js/data.js" charset="utf-8"></script>
    <script src="./js/start.js" charset="utf-8"></script>
    <script src="./js/share.js" charset="utf-8"></script>
  </div>
</body>
</html>
